# Local infrastructure for Phase 6 (ADR-0013). MySQL stays on the host (ADR-0002).
#   docker compose up -d redis              # Redis only (tests, single or multiple dev servers)
#   docker compose --profile lb up -d       # + nginx load balancer on :8080 → API servers on host :3001 and :3002
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lb:
    profiles: ["lb"]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
