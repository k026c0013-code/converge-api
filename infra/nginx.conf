# Round-robin load balancer for two API servers on the host (ADR-0013).
# No sticky sessions are needed: tickets, presence and updates are shared through Redis.
events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream converge_api {
    server host.docker.internal:3001 max_fails=1 fail_timeout=5s;
    server host.docker.internal:3002 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 8080;
    client_max_body_size 64k;

    location /ws/ {
      proxy_pass http://converge_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_read_timeout 3600s;
      proxy_next_upstream error timeout;
    }

    location /api/ {
      proxy_pass http://converge_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout;
    }
  }
}
