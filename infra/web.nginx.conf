# Serves the web app and balances /api + /ws over the API containers (docker compose profile "full").
events {}

http {
  include /etc/nginx/mime.types;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream converge_api {
    server api1:3000 max_fails=1 fail_timeout=5s;
    server api2:3000 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 8080;
    client_max_body_size 64k;
    root /usr/share/nginx/html;

    location /ws/ {
      proxy_pass http://converge_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_read_timeout 3600s;
      proxy_next_upstream error timeout;
    }

    location /api/ {
      proxy_pass http://converge_api;
      proxy_set_header Host $host;
      proxy_next_upstream error timeout;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
      try_files $uri /index.html;
    }
  }
}
